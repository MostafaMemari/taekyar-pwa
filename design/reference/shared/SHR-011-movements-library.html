            <span class="grid size-16 shrink-0 place-items-center rounded-xl bg-gray-50 text-gray-300"><i data-lucide="footprints" class="size-6"></i></span>
            <span class="min-w-0 flex-1">
              <span class="block truncate text-[13px] font-extrabold text-gray-900">میرو چیگی</span>
              <span dir="ltr" class="mt-0.5 block truncate text-[11px] font-semibold text-gray-400">Miro-chagi</span>
              <span class="mt-1.5 flex items-center gap-1.5 text-[10px] font-semibold text-gray-400"><span class="belt-dot" style="background:#CE004F"></span>ضربات پا</span>
            </span>

          <div class="empty-state hidden" data-empty>

    <!-- detail sheet -->
    <div class="overlay hidden" id="mv-sheet" role="dialog" aria-modal="true">

          <span class="sheet-grab"></span>
          <p class="modal-title">جزئیات فن</p>
          <button type="button" class="icon-btn !size-8" data-close aria-label="بستن"><i data-lucide="x" class="size-4"></i></button>
        </div>
        <div class="sheet-body">
          <div class="flex items-center gap-3">
            <span class="grid size-14 shrink-0 place-items-center rounded-2xl bg-gray-50 text-gray-300"><i data-lucide="dumbbell" class="size-6"></i></span>
            <div class="min-w-0 flex-1">
              <p class="text-[15px] font-extrabold text-gray-900" data-s-name>—</p>
              <p dir="ltr" class="mt-0.5 text-[12px] font-semibold text-gray-400" data-s-latin>—</p>
            </div>
          </div>
          <div class="mt-3 flex flex-wrap gap-1.5">
            <span class="chip chip-gray" data-s-type>فن</span>
            <span class="chip chip-gray"><span class="belt-dot" data-s-dot style="background:#9CA3AF"></span><span data-s-cat>—</span></span>
          </div>
          <div class="mt-4">
            <p class="section-title mb-1">توضیحات</p>
            <p class="text-[12px] leading-6 text-gray-600" data-s-desc>—</p>
          </div>
        </div>
      </div>
    </div>

    
    <script src="../../assets/js/vendor/lucide.min.js" defer></script>
    <script src="../../assets/js/app.js" defer></script>
    <script>
      /* combined demo filter: search + type seg + category chips + count + empty */
      (function () {
        var input = document.getElementById("search");
        var rows = Array.prototype.slice.call(document.querySelectorAll("#list [data-mv]"));
        var empty = document.querySelector("#list [data-empty]");
        var count = document.getElementById("mv-count");
        var type = "";
        var cat = "";
        var fa = function (n) { return String(n).replace(/\d/g, function (d) { return "۰۱۲۳۴۵۶۷۸۹"[d]; }); };
        function apply() {
          var q = (input.value || "").trim().toLowerCase();
          var shown = 0;
          rows.forEach(function (r) {
            var ok = (!q || (r.getAttribute("data-search") || "").toLowerCase().indexOf(q) !== -1)
              && (!type || r.getAttribute("data-type") === type)
              && (!cat || r.getAttribute("data-cat") === cat);
            r.classList.toggle("hidden", !ok);
            if (ok) shown++;
          });
          empty.classList.toggle("hidden", shown > 0);
          count.textContent = fa(shown) + " فن";
        }
        input.addEventListener("input", apply);
        document.getElementById("type-seg").addEventListener("seg:change", function (e) { type = e.detail.value; apply(); });
        document.getElementById("cat-chips").addEventListener("chips:change", function () {
          var active = document.querySelector("#cat-chips .filter-chip.is-active");
          cat = active ? (active.getAttribute("data-cat") || "") : "";
          apply();
        });
        /* fill detail sheet from row data (app.js opens the overlay via data-sheet) */
        document.addEventListener("click", function (e) {
          var row = e.target.closest("[data-mv]");
          if (!row) return;
          var set = function (sel, v) { var el = document.querySelector(sel); if (el) el.textContent = v; };
          set("[data-s-name]", row.getAttribute("data-name") || "—");
          set("[data-s-latin]", row.getAttribute("data-latin") || "—");
          set("[data-s-cat]", row.getAttribute("data-cat-name") || "—");
          set("[data-s-type]", row.getAttribute("data-type-label") || "فن");
          set("[data-s-desc]", row.getAttribute("data-desc") || "—");
          var dot = document.querySelector("[data-s-dot]");
          if (dot) dot.style.background = row.getAttribute("data-color") || "#9CA3AF";
        });
      })();
    </script>
</body>
